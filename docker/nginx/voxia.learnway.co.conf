# Nginx Proxy Manager — "Custom Nginx Configuration" snippet for the
# voxia.learnway.co Proxy Host (Advanced tab). NPM already builds the
# server{} block, handles the Let's Encrypt cert, and forwards `/` to
# builder:3000 via the Details tab — this snippet only adds the extra
# routes for realtime (PartyKit WebSockets) and storage uploads, which the
# Details tab can't express since it only forwards to a single host:port.
#
# Where it goes: Proxy Hosts -> voxia.learnway.co -> Edit -> Advanced tab
# -> "Custom Nginx Configuration" box. Paste exactly this, then Save.

location /parties/ {
    proxy_pass http://realtime:1999;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# Storage (RustFS, path-style S3): the browser PUTs uploads straight to the
# presigned URL https://voxia.learnway.co/<bucket>/<key>. The path must match
# S3_BUCKET in .env, and Host must pass through unchanged — it is part of the
# signature the builder computed for S3_PUBLIC_ENDPOINT.
# Resolved per request through Docker's DNS, so a missing voxia-filesystem
# only fails uploads (502) instead of making nginx reject the whole host.
location /voxia/ {
    resolver 127.0.0.11 valid=30s;
    set $voxia_filesystem http://voxia-filesystem:9000;
    proxy_pass $voxia_filesystem;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m;
    proxy_request_buffering off;
}

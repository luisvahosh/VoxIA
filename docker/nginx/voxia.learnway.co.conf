# Nginx Proxy Manager — "Custom Nginx Configuration" snippet for the
# voxia.learnway.co Proxy Host (Advanced tab). NPM already builds the
# server{} block, handles the Let's Encrypt cert, and forwards `/` to
# builder:3000 via the Details tab — this snippet only adds the extra
# route for realtime (PartyKit WebSockets), which the Details tab can't
# express since it only forwards to a single host:port.
#
# Where it goes: Proxy Hosts -> voxia.learnway.co -> Edit -> Advanced tab
# -> "Custom Nginx Configuration" box. Paste exactly this, then Save.

location /parties/ {
    proxy_pass http://realtime:1999;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
